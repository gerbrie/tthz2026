name: Controleer Drupal-configuratie op geheimen

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Haal repository op
        uses: actions/checkout@v4

      - name: Controleer gevoelige configuratievelden
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib
          import re
          import sys

          velden = (
              "secret_key",
              "smtp_password",
              "encrypt_password",
              "client_secret",
              "api_key",
              "access_token",
              "private_key",
          )

          patroon = re.compile(
              r"^\s*(" + "|".join(velden) + r")\s*:\s*(.*?)\s*$",
              re.IGNORECASE,
          )

          fouten = 0
          bestanden = list(pathlib.Path("config/sync").glob("*.yml"))

          for bestand in bestanden:
              for regel in bestand.read_text(encoding="utf-8").splitlines():
                  match = patroon.match(regel)
                  if not match:
                      continue

                  waarde = match.group(2).strip()
                  if waarde and waarde not in ("''", '""', "null", "~"):
                      print(f"MOGELIJK GEHEIM: {bestand.name} ({match.group(1)})")
                      fouten += 1

          print(f"Gecontroleerde YAML-bestanden: {len(bestanden)}")
          print(f"Mogelijke geheimen: {fouten}")

          if fouten:
              sys.exit(1)

          print("Beveiligingscontrole geslaagd.")
          PY
